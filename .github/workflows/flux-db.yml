name: Flux db loader
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add flux-db JS to index
        run: |
          python3 - << 'PY'
          import pathlib
          p = pathlib.Path('index.html')
          t = p.read_text()
          if 'flux-db.js' not in t:
              t = t.replace('flux-mixer.js"></script>', 'flux-mixer.js"></script><script defer src="flux-db.js"></script>', 1)
              if 'flux-db.js' not in t:
                  t = t.replace('</head>', '<script defer src="flux-db.js"></script></head>', 1)
              p.write_text(t)
          print('flux-db loader present', 'flux-db.js' in p.read_text())
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "feat: load FLUX database layer"
          git push
