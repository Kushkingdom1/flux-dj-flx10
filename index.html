<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLUX DJ - FLX10 Edition</title><style>body{font-family:-apple-system,Arial,sans-serif;background:#07080c;color:#eef1ff;margin:0;padding:20px}h1{font-size:32px}span{color:#00c2ff}.deck{border:1px solid #343c5c;background:#11141d;border-radius:14px;padding:14px;margin:14px 0}button{background:#242a3f;color:#fff;border:1px solid #343c5c;border-radius:8px;padding:10px 12px;font-weight:700;cursor:pointer}button.active{background:#0b6f92}.jog{width:150px;height:150px;border-radius:50%;background:#05070d;border:3px solid #333c5c;display:flex;flex-direction:column;align-items:center;justify-content:center}.bpm{font-size:26px;font-weight:900}canvas{width:100%;height:70px;background:#05070d;border:1px solid #252c44;border-radius:8px}input{accent-color:#00c2ff}</style></head><body><h1>FLUX <span>DJ</span> - FLX10 Edition</h1><p>4-deck semi clone. Click ENABLE AUDIO, then TEST 128.</p><button id="en">ENABLE AUDIO</button><span id="st">Ready</span><div id="root"></div><script>let ctx,gain,an,ready=false;const decks=[];function db(g){return Math.pow(10,g/20)}function init(){if(ready){ctx.resume();return}ctx=new(window.AudioContext||window.webkitAudioContext)();gain=ctx.createGain();gain.gain.value=.67;an=ctx.createAnalyser();gain.connect(an);an.connect(ctx.destination);decks.forEach(d=>{let s=ctx.createMediaElementSource(d.a),l=ctx.createBiquadFilter(),m=ctx.createBiquadFilter(),h=ctx.createBiquadFilter(),lg=ctx.createGain(),mg=ctx.createGain(),hg=ctx.createGain(),mg2=ctx.createGain(),f=ctx.createBiquadFilter(),v=ctx.createGain(),c=ctx.createGain(),x=ctx.createGain();l.type='lowpass';l.frequency.value=220;m.type='bandpass';m.frequency.value=1000;h.type='highpass';h.frequency.value=6200;f.type='lowpass';f.frequency.value=20000;s.connect(l);s.connect(m);s.connect(h);l.connect(lg);m.connect(mg);h.connect(hg);lg.connect(mg2);mg.connect(mg2);hg.connect(mg2);mg2.connect(f);f.connect(v);v.connect(c);c.connect(gain);d.nodes={lg,mg,hg,f,v};});ready=true;st.textContent='Audio ON'}function testFile(){let sr=44100,dur=24,n=sr*dur,a=new Float32Array(n),bt=60/128;let sd=7,r=()=>(sd=(sd*16807)%2147483647)/2147483647;for(let b=0;b<dur/bt;b++){let s=Math.floor(b*bt*sr);for(let i=0;i<sr*.22&&s+i<n;i++){let t=i/sr;a[s+i]+=Math.sin(2*Math.PI*(50+100*Math.exp(-t*30))*t)*Math.exp(-t*12)*.9}let hs=Math.floor((b*bt+bt/2)*sr);for(let i=0;i<sr*.05&&hs+i<n;i++)a[hs+i]+=(r()*2-1)*.2;for(let i=0;i<bt*sr*.9&&s+i<n;i++)a[s+i]+=.35*Math.sin(2*Math.PI*55*(i/sr))}let w=new ArrayBuffer(44+n*2),v=new DataView(w),ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};ws(0,'RIFF');v.setUint32(4,36+n*2,true);ws(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*2,true);for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,a[i]))*32767,true);return new File([new Blob([w],{type:'audio/wav'})],'TEST128.wav')}let root=document.getElementById('root'),st=document.getElementById('st');document.getElementById('en').onclick=init;for(let i=1;i<=4;i++){let div=document.createElement('div');div.className='deck';div.innerHTML='<h2>DECK '+i+'</h2><div class="jog"><div>BPM</div><div class="bpm" id="bpm'+i+'">---</div><div id="pitch'+i+'">+0.0%</div></div><canvas id="w'+i+'" width="800" height="70"></canvas><br><button id="load'+i+'">LOAD</button> <input type="file" id="file'+i+'" accept="audio/*" hidden> <button id="test'+i+'">TEST 128</button> <button id="play'+i+'">PLAY</button> <button id="cue'+i+'">CUE</button> <button id="sync'+i+'">SYNC</button> <label>TEMPO <input type="range" id="tempo'+i+'" min="-16" max="16" step="0.1" value="0"></label> <button id="dr'+i+'" class="active">DRUMS</button> <button id="vo'+i+'" class="active">VOCAL</button> <button id="ins'+i+'" class="active">INST</button><audio id="a'+i+'"></audio>';root.appendChild(div);let d={i,a:div.querySelector('#a'+i),bpm:128,tempo:0,stems:{drums:1,vocal:1,inst:1}};decks.push(d);div.querySelector('#load'+i).onclick=()=>div.querySelector('#file'+i).click();div.querySelector('#file'+i).onchange=e=>{if(e.target.files[0])load(d,e.target.files[0])};div.querySelector('#test'+i).onclick=()=>load(d,testFile());div.querySelector('#play'+i).onclick=()=>{init();d.a.paused?d.a.play():d.a.pause()};div.querySelector('#cue'+i).onclick=()=>{d.a.currentTime=0;if(d.a.paused)d.a.play()};div.querySelector('#tempo'+i).oninput=e=>{d.tempo=+e.target.value;d.a.playbackRate=1+d.tempo/100;d.a.preservesPitch=true;ui(d)};div.querySelector('#sync'+i).onclick=()=>{let m=decks[0];if(m===d)return;let t=m.bpm*(m.a.playbackRate||1);d.tempo=Math.max(-16,Math.min(16,(t/d.bpm-1)*100));div.querySelector('#tempo'+i).value=d.tempo;d.a.playbackRate=1+d.tempo/100;ui(d)};['drums','vocal','inst'].forEach((k,j)=>{div.querySelector('#'+['dr','vo','ins'][j]+i).onclick=e=>{d.stems[k]=!d.stems[k];e.target.classList.toggle('active',d.stems[k]);if(ready){d.nodes.lg.gain.value=(d.stems.drums||d.stems.inst)?1:0;d.nodes.mg.gain.value=(d.stems.vocal||d.stems.inst)?1:0;d.nodes.hg.gain.value=(d.stems.drums||d.stems.inst)?1:0}}})}async function load(d,f){init();d.a.src=URL.createObjectURL(f);d.a.load();st.textContent='Loaded Deck '+d.i+': '+f.name;try{let b=await ctx.decodeAudioData(await f.arrayBuffer());draw(d,b)}catch(e){} ui(d)}function draw(d,b){let c=document.getElementById('w'+d.i),g=c.getContext('2d'),ch=b.getChannelData(0);g.fillStyle='#05070d';g.fillRect(0,0,c.width,c.height);for(let x=0;x<c.width;x++){let s=Math.floor(x/c.width*ch.length),m=0;for(let j=0;j<200;j+=10)m=Math.max(m,Math.abs(ch[s+j]||0));g.fillStyle=m>.6?'#ff3860':'#00c2ff';g.fillRect(x,35-m*32,1,m*64)}}function ui(d){document.getElementById('bpm'+d.i).textContent=d.a.src?(d.bpm*(d.a.playbackRate||1)).toFixed(2):'---';document.getElementById('pitch'+d.i).textContent=(d.tempo>=0?'+':'')+d.tempo.toFixed(1)+'%'}setInterval(()=>decks.forEach(ui),250);</script></body></html>
